<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Root Label Mode Test - Sand.js</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      margin: 0 0 10px 0;
      font-size: 24px;
      color: #333;
    }
    .description {
      margin-bottom: 20px;
      color: #666;
      font-size: 14px;
    }
    .controls {
      margin-bottom: 20px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 6px;
    }
    .control-group {
      margin-bottom: 10px;
    }
    label {
      display: inline-block;
      margin-right: 15px;
      font-size: 14px;
      color: #333;
    }
    input[type="radio"] {
      margin-right: 5px;
    }
    #chart {
      width: 100%;
      height: 600px;
      display: block;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Root Label Mode Test</h1>
    <div class="description">
      Testing the <code>rootLabelMode</code> option which controls whether root node labels are curved or straight.
    </div>

    <div class="controls">
      <div class="control-group">
        <strong>Root Label Mode:</strong>
        <label>
          <input type="radio" name="mode" value="curved" checked>
          Curved (default)
        </label>
        <label>
          <input type="radio" name="mode" value="straight">
          Straight
        </label>
      </div>
    </div>

    <svg id="chart"></svg>
  </div>

  <script type="module">
    import { renderSVG } from '../dist/sandjs.mjs';

    const config = {
      size: {
        radius: 280,
        angle: Math.PI * 2
      },
      layers: [
        {
          id: 'main',
          radialUnits: [0, 10],
          tree: {
            name: 'Company',
            key: 'root',
            children: [
              {
                name: 'Engineering',
                key: 'eng',
                children: [
                  { name: 'Frontend', value: 30 },
                  { name: 'Backend', value: 25 },
                  { name: 'DevOps', value: 15 }
                ]
              },
              {
                name: 'Design',
                key: 'design',
                children: [
                  { name: 'UI/UX', value: 20 },
                  { name: 'Graphics', value: 10 }
                ]
              },
              {
                name: 'Sales',
                key: 'sales',
                children: [
                  { name: 'Enterprise', value: 35 },
                  { name: 'SMB', value: 25 }
                ]
              },
              {
                name: 'Marketing',
                key: 'marketing',
                children: [
                  { name: 'Content', value: 15 },
                  { name: 'Social', value: 12 }
                ]
              }
            ]
          }
        }
      ]
    };

    let handle = renderSVG({
      el: '#chart',
      config,
      labels: {
        rootLabelMode: 'curved'
      },
      colorTheme: {
        type: 'qualitative',
        palette: 'default',
        assignBy: 'key'
      },
      transition: {
        duration: 600
      }
    });

    // Listen to radio button changes
    document.querySelectorAll('input[name="mode"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        const mode = e.target.value;
        handle = handle.update({
          labels: {
            rootLabelMode: mode
          }
        });
      });
    });
  </script>
</body>
</html>
